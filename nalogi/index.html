<style>
/* Layout: narrow document column; one question per screen, then a short verdict with everything else folded away */
:root{
  --bg:#FAF7F0; --surface:#FFFFFF; --surface-2:#F2EDE1;
  --ink:#1C1A16; --muted:#6E675B; --line:#E3DCCD;
  --accent:#E0A100; --accent-soft:#FBEBBF; --accent-ink:#2A2000;
  --good:#2C6E49; --good-soft:#DFEFE4;
  --warn:#9C4A12; --warn-soft:#FAE5D4;
  --crit:#9B1C1C; --crit-soft:#F8DEDE;
  --display:'Onest',ui-sans-serif,system-ui,sans-serif;
  --body:'Golos Text',ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141310; --surface:#1D1B16; --surface-2:#24211A;
  --ink:#F2EDE0; --muted:#A79E8B; --line:#332F26;
  --accent:#F3C44A; --accent-soft:#3A2F10; --accent-ink:#1A1400;
  --good:#7FC79B; --good-soft:#1B2C22;
  --warn:#E6975F; --warn-soft:#2F2016;
  --crit:#E58282; --crit-soft:#2E1919;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141310; --surface:#1D1B16; --surface-2:#24211A;
  --ink:#F2EDE0; --muted:#A79E8B; --line:#332F26;
  --accent:#F3C44A; --accent-soft:#3A2F10; --accent-ink:#1A1400;
  --good:#7FC79B; --good-soft:#1B2C22;
  --warn:#E6975F; --warn-soft:#2F2016;
  --crit:#E58282; --crit-soft:#2E1919;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:26px 56px}
img{max-width:100%}

.masthead{display:flex;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.masthead div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.masthead img{width:96px;flex:none;margin-bottom:-12px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.5vw,36px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.lede{font-size:17px;margin:0 0 16px}
.lede strong{font-weight:600}
.intro-row{display:flex;gap:16px;align-items:flex-end}
.intro-row img{width:112px;flex:none}
.intro-row > div{flex:1;min-width:0}

button{font:inherit;cursor:pointer}
.btn{font-family:var(--display);font-weight:700;font-size:15px;border:none;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);padding:13px 22px;width:100%;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;width:auto;padding:10px 16px;font-size:14px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

.prog{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:0}

h2{font-family:var(--display);font-weight:700;font-size:clamp(19px,4.4vw,24px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:var(--surface-2);
  border:1.5px solid transparent;border-radius:10px;padding:13px 15px;color:var(--ink);font-size:15px;font-weight:500;transition:border-color .12s}
.opt:hover{border-color:var(--accent)}
.opt b{font-family:var(--display);font-size:12px;font-weight:700;color:var(--muted);min-width:14px}

.verdict{border:2px solid var(--ink);border-radius:14px;background:var(--accent-soft);padding:20px;
  display:flex;align-items:flex-end;gap:12px}
.verdict > div{flex:1;min-width:0}
.verdict img{width:84px;flex:none;margin-bottom:-6px}
.label{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rate{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,62px);line-height:1;letter-spacing:-.03em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.basis{font-size:14px;color:var(--muted);margin:0}

h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 8px}
.card p{margin:0;font-size:15px}
.card p + p{margin-top:9px}
.card.crit{background:var(--crit-soft);border-color:var(--crit)}
.card.good{background:var(--good-soft);border-color:var(--good)}
.card.focus{border-left:4px solid var(--accent)}
.with-sticker{display:flex;gap:14px;align-items:flex-start}
.with-sticker > div{flex:1;min-width:0}
.with-sticker img{width:76px;flex:none}

.cta{background:var(--ink);color:var(--bg);border-radius:14px;padding:22px 20px;display:flex;gap:14px;align-items:flex-end}
.cta > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.cta img{width:92px;flex:none;margin-bottom:-4px}
.cta h3{color:var(--bg);font-size:20px;margin:0}
.cta p{margin:0;font-size:14.5px;opacity:.85}
.word{display:inline-flex;background:var(--accent);color:var(--accent-ink);
  font-family:var(--display);font-weight:800;font-size:18px;border-radius:9px;padding:11px 18px;align-self:flex-start}
.handle{font-family:var(--display);font-weight:600;font-size:14px;opacity:.75}

details{background:var(--surface);border:1px solid var(--line);border-radius:14px}
summary{font-family:var(--display);font-weight:700;font-size:15px;padding:16px 20px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted);font-weight:500}
details[open] summary::after{content:"－"}
.inner{padding:0 20px 20px;display:flex;flex-direction:column;gap:18px}
.block h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rows li{display:flex;gap:12px;align-items:baseline;font-size:14px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.rows li:last-child{border-bottom:none;padding-bottom:0}
.rows .when{font-family:var(--display);font-weight:700;font-size:13px;min-width:86px;flex:none;color:var(--accent);font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.note{font-size:14px;margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line)}
.note:last-child{margin-bottom:0}
.note b{font-weight:600;display:block}
.fineprint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.restart{display:flex;justify-content:center;align-items:center;gap:10px}
.restart img{width:52px}

/* чек */
.receipt-wrap{overflow-x:auto}
.receipt{width:272px;background:#FFFDF8;color:#1C1A16;border:1px solid #D8D0BE;border-radius:4px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;line-height:1.5;padding:14px 13px;
  box-shadow:0 1px 0 #D8D0BE}
.receipt .c{text-align:center}
.receipt .hr{border-top:1px dashed #B9B0A0;margin:7px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt .big{font-weight:700;font-size:13px}
.receipt mark{background:#FFE9A3;color:#1C1A16;padding:0 2px;border-radius:2px}
.qr{width:62px;height:62px;margin:8px auto 0;display:block}
.legend{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.legend li{display:flex;gap:8px}
.legend span{width:9px;height:9px;border-radius:2px;background:#FFE9A3;flex:none;margin-top:5px;border:1px solid var(--line)}
/* форма заявки */
/* кнопка «написать в Telegram» внутри тёмного блока */
.tgbtn{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;text-decoration:none;
  font-family:var(--display);font-weight:800;font-size:17px;border-radius:9px;padding:12px 19px;
  background:var(--accent);color:var(--accent-ink)}
.tgbtn svg{width:19px;height:19px;flex:none;fill:currentColor}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

  <header class="masthead">
    <div>
      <span class="eyebrow">Для предпринимателей Кыргызстана</span>
      <h1>Налоговый чек-ап</h1>
      <p class="sub">По Налоговому кодексу КР в редакции от 06.08.2026</p>
    </div>
    <img src="stickers/cat_stand.png" alt="" aria-hidden="true">
  </header>

  <section id="intro" class="card">
    <div class="intro-row">
      <div>
        <p class="lede">Несколько вопросов в одно нажатие — и вы увидите <strong>свою ставку</strong> и где сейчас ваши риски.</p>
      </div>
      <img src="stickers/girl_full.png" alt="" aria-hidden="true">
    </div>
    <button class="btn" id="start">Начать · 3 минуты</button>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="prog"><span id="pcount"></span><span class="bar"><i id="pbar"></i></span></div>
    <div style="margin-top:18px">
      <h2 id="qtitle"></h2>
      <p class="hint" id="qhint"></p>
      <div class="opts" id="qopts"></div>
      <div style="margin-top:16px"><button class="btn ghost" id="back">Назад</button></div>
    </div>
  </section>

  <section id="result" hidden style="display:flex;flex-direction:column;gap:18px"></section>

</div>

<script>
(function(){
  "use strict";

  var is = function(k,v){ return function(a){ return a[k] === v; }; };
  var rateActs = ["trade","prod","soft","services","other"];
  var peopleActs = ["trade","food","services","sauna","other"];

  var QUESTIONS = [
    { id:"form", title:"Кто вы по форме?", hint:"От этого зависит часть ставок и обязанностей.",
      opts:[["ip","Индивидуальный предприниматель"],["too","ОсОО или другое юрлицо"]] },

    { id:"mode", title:"На каком вы режиме?", hint:"Если не уверены — так и ответьте, я это учту.",
      opts:[["simple","Единый налог (упрощёнка)"],["general","Общий режим"],["patent","Патент"],["unknown","Не знаю"]] },

    { id:"act", title:"Чем вы занимаетесь?", hint:"Если видов несколько — выберите тот, что даёт основную выручку.",
      opts:[["trade","Торговля"],["prod","Производство или переработка сельхозпродукции"],
            ["sewing","Швейное или текстильное производство"],["jewelry","Ювелирные изделия"],
            ["food","Общественное питание"],["sauna","Сауна или баня"],
            ["build","Продажа вновь построенных помещений"],
            ["soft","Разработка ПО, туроператор или турагент"],
            ["services","Услуги населению"],["other","Другое"]] },

    { id:"city", title:"Где вы работаете?", hint:"В общепите ставка в столице и в регионах отличается почти вдвое.",
      when: is("act","food"),
      opts:[["bo","Бишкек или Ош"],["reg","Другой регион"]] },

    { id:"rev", title:"Выручка за последние 12 месяцев подряд?", hint:"Именно за 12 месяцев подряд, а не за календарный год.",
      opts:[["lt15","До 15 млн сомов"],["m15_50","От 15 до 50 млн"],["gt50","Больше 50 млн"]] },

    { id:"account", title:"На какой счёт вам приходят деньги?",
      hint:"Бизнес-счёт — тот, что открыт на ИП или ОсОО: МБизнес, Бакай Бизнес и подобные приложения для бизнеса. Личный — оформленный на вас как на физлицо.",
      opts:[["biz","На бизнес-счёт ИП или ОсОО"],["both","И на бизнес-счёт, и на личную карту"],
            ["personal","На личную карту"],["cash","Только наличными"]] },

    { id:"staff", title:"Есть наёмные работники?", hint:"Хотя бы один оформленный человек.",
      opts:[["no","Нет, работаю один"],["yes","Да, есть"]] },

    { id:"kkm", title:"Какая у вас касса?",
      hint:"Если вы работаете с населением, касса должна быть фискальной. Как выглядит фискальный чек — покажу в конце.",
      when: function(a){ return peopleActs.indexOf(a.act) >= 0; },
      opts:[["fiscal","Фискальная, чек с фискальным признаком"],["unsure","Касса есть, но фискальная ли — не знаю"],["no","Кассы нет"]] },

    { id:"pay", title:"Как с вами чаще расплачиваются?", hint:"Наличные и безнал облагаются по разным ставкам.",
      when: function(a){ return rateActs.indexOf(a.act) >= 0; },
      opts:[["card","Чаще безналично"],["cash","Чаще наличными"]] },

    { id:"trader", title:"Вы импортируете, экспортируете или работаете дистрибьютором?",
      hint:"Сюда же — ГСМ, лекарства и зоны торговли с особым режимом.",
      when: is("act","trade"),
      opts:[["no","Нет"],["yes","Да, что-то из этого есть"]] },

    { id:"tech", title:"Продаёте холодильники, стиральные машины, телевизоры или мониторы?",
      hint:"С 1 сентября 2026 они попали под прослеживаемость ЕАЭС.",
      when: is("act","trade"),
      opts:[["no","Нет"],["yes","Да"]] },

    { id:"ecp", title:"Где сейчас ваша электронная подпись?", hint:"Последний вопрос. Он не про налоги, он про риск.",
      opts:[["me","У меня, никому не передавала"],["other","У бухгалтера или помощника"],["dunno","Честно — не знаю"]] }
  ];

  var answers = {}, step = 0;
  var $ = function(id){ return document.getElementById(id); };
  var vis = function(i){ var q = QUESTIONS[i]; return !q.when || q.when(answers); };
  var fwd = function(i){ for(; i < QUESTIONS.length; i++) if(vis(i)) return i; return -1; };
  var bwd = function(i){ for(; i >= 0; i--) if(vis(i)) return i; return -1; };

  function render(){
    var q = QUESTIONS[step], total = 0, pos = 0;
    for(var i = 0; i < QUESTIONS.length; i++){ if(vis(i)){ total++; if(i <= step) pos++; } }
    $("pcount").textContent = pos + " / " + total;
    $("pbar").style.width = Math.round(pos/total*100) + "%";
    $("qtitle").textContent = q.title;
    $("qhint").textContent = q.hint;
    var box = $("qopts"); box.textContent = "";
    q.opts.forEach(function(o, i){
      var b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      var tag = document.createElement("b"); tag.textContent = String.fromCharCode(1040 + i);
      var sp = document.createElement("span"); sp.textContent = o[1];
      b.appendChild(tag); b.appendChild(sp);
      b.addEventListener("click", function(){
        answers[q.id] = o[0];
        var n = fwd(step + 1);
        if(n === -1){ $("quiz").hidden = true; show(); }
        else { step = n; render(); window.scrollTo({top:0,behavior:"smooth"}); }
      });
      box.appendChild(b);
    });
    $("back").hidden = bwd(step - 1) === -1;
  }

  $("start").addEventListener("click", function(){
    $("intro").hidden = true; $("quiz").hidden = false; step = fwd(0); render();
  });
  $("back").addEventListener("click", function(){
    var p = bwd(step - 1); if(p !== -1){ step = p; render(); }
  });

  /* ---------- ставка по статье 423 ---------- */
  function computeRate(a){
    var cash = a.pay === "cash";
    if(a.mode === "patent")  return {kind:"patent"};
    if(a.mode === "general") return {kind:"general"};
    if(a.act === "sewing")  return {rate:"0,25%", basis:"швейное и текстильное производство", ref:"часть 3 статьи 423"};
    if(a.act === "jewelry") return {rate:"0,25%", basis:"ювелирные изделия", ref:"часть 3 статьи 423"};
    if(a.act === "food")    return a.city === "bo"
        ? {rate:"5%", basis:"общепит в Бишкеке и Оше", ref:"часть 5 статьи 423"}
        : {rate:"3%", basis:"общепит вне Бишкека и Оша", ref:"часть 5 статьи 423"};
    if(a.act === "sauna")   return {rate:"5%", basis:"услуги саун и бань", ref:"часть 4-1 статьи 423"};
    if(a.act === "build")   return {rate:"4%", basis:"продажа вновь построенных помещений", ref:"часть 4-2 статьи 423"};
    if(a.act === "trade"){
      if(a.rev !== "gt50" && a.trader === "no")
        return {rate:"0,5%", basis:"торговля с выручкой до 50 млн сомов", ref:"пункт 1 части 1 статьи 423"};
      return {rate: cash ? "4%" : "2%", basis:"торговая деятельность", ref:"пункт 1 части 1 статьи 423"};
    }
    if(a.act === "prod" || a.act === "soft")
      return {rate: cash ? "4%" : "2%", basis:"производство, переработка, ПО и туризм", ref:"пункт 2 части 1 статьи 423"};

    var cta = el("div","cta"), ctd = el("div");
    ctd.appendChild(el("h3", null, "Хотите, чтобы это посчитала я?"));
    ctd.appendChild(el("p", null, "Эта страница считает по вашим ответам. Она не видит договоров и выписок — а переплата обычно прячется именно там."));

    var tg = el("a","tgbtn");
    /* готовый текст Telegram подставляет только в переписку с человеком;
       у бота он его игнорирует, поэтому там ссылка остаётся голой */
    tg.href = TG_CONTACT + (TG_IS_PERSON ? "?text=" + encodeURIComponent(
      "Налоги. Прошёл(ла) чек-ап: " + lbl("form") + ", " + lbl("act") +
      ", ставка " + rateText(r) + ". Хочу разбор.") : "");
    tg.target = "_blank"; tg.rel = "noopener";
    tg.addEventListener("click", function(){
      logAnswers(r, f, al, "нажал написать");   // строка в таблицу
      notifyBot(r, f, al);                      // сообщение в Telegram
    });
    var ico = document.createElementNS("http://www.w3.org/2000/svg","svg");
    ico.setAttribute("viewBox","0 0 24 24"); ico.setAttribute("aria-hidden","true");
    var pth = document.createElementNS("http://www.w3.org/2000/svg","path");
    pth.setAttribute("d","M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1 1.4 11.6c-1-.3-1.1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.3 1.5z");
    ico.appendChild(pth); tg.appendChild(ico);
    tg.appendChild(document.createTextNode("Написать в Telegram"));
    ctd.appendChild(tg);

    ctd.appendChild(el("span","handle","или слово «налоги» в директ @ainazik.mamaevaa"));
    cta.appendChild(ctd); cta.appendChild(sticker("girl_think"));
    out.appendChild(cta);

    /* 6. Всё остальное — свёрнуто */
    var d = document.createElement("details");
    var s = document.createElement("summary"); s.appendChild(document.createTextNode("Что ещё я проверила"));
    d.appendChild(s);
    var inner = el("div","inner");

    if(f.length > 1){
      var b1 = el("div","block"); b1.appendChild(el("h4", null, "Ещё по деньгам"));
      f.slice(1).forEach(function(x){
        var n = el("div","note"); n.appendChild(el("b", null, x.t));
        n.appendChild(document.createTextNode(x.b)); b1.appendChild(n);
      });
      inner.appendChild(b1);
    }

    /* чек — если касса вообще обсуждалась и она не фискальная */
    if(a.kkm && a.kkm !== "fiscal") inner.appendChild(receiptBlock());

    var b2 = el("div","block"); b2.appendChild(el("h4", null, "Ваши сроки"));
    var list = el("ul","rows");
    function row(w,t){ var li=el("li"); li.appendChild(el("span","when",w)); li.appendChild(el("div",null,t)); return li; }
    if(!r.kind) list.appendChild(row("до 20 числа","Отчёт по единому налогу и уплата. Для малого бизнеса период — квартал."));
    if(a.mode === "general"){
      list.appendChild(row("до 20 числа","Налог с продаж. Для малого бизнеса — ежеквартально."));
      list.appendChild(row("до 25 числа","Отчётность по НДС и уплата НДС."));
    }
    if(a.staff === "yes") list.appendChild(row("до 20 числа","Отчёт по подоходному налогу за работников."));
    list.appendChild(row("до 20 числа","Налог на нежилое имущество — в третьем месяце каждого квартала."));
    list.appendChild(row("до 1 сентября","Налог на жилое имущество, раз в год."));
    b2.appendChild(list); inner.appendChild(b2);

    if(a.form === "ip"){
      var b6 = el("div","block"); b6.appendChild(el("h4", null, "Если вы ИП — полис за себя"));
      var p6 = el("p"); p6.style.cssText = "margin:0;font-size:14px";
      p6.textContent = "Кроме налога, индивидуальный предприниматель обязан покупать страховой полис за самого себя. Его стоимость — 6% от усечённой средней заработной платы (УСМЗ) по тому району, в котором вы прописаны. УСМЗ в районах разная, поэтому точную сумму смотрите по своему району.";
      b6.appendChild(p6);
      var p7 = el("p"); p7.style.cssText = "margin:9px 0 0;font-size:14px";
      p7.textContent = "Про полис забывают чаще всего — он не приходит напоминанием и не висит в кабинете строкой «вы должны».";
      b6.appendChild(p7);
      inner.appendChild(b6);
    }

    if(al.length > 1){
      var b3 = el("div","block"); b3.appendChild(el("h4", null, "Остальные проверки"));
      al.slice(1).forEach(function(x){
        var n = el("div","note"); n.appendChild(el("b", null, x.t));
        n.appendChild(document.createTextNode(x.b + (x.b2 ? " " + x.b2 : ""))); b3.appendChild(n);
      });
      var n2 = el("div","note"); n2.appendChild(el("b", null, "Не давайте паспорт на чужую фирму"));
      n2.appendChild(document.createTextNode("Указ от 9 октября 2026 вводит ответственность за оформление бизнеса на подставных лиц и привлечение тех, кто реально управляет бизнесом. Там же предусмотрен самозапрет — возможность запретить регистрацию фирм на своё имя. Механизм ещё предстоит запустить."));
      b3.appendChild(n2);
      inner.appendChild(b3);
    }

    var b4 = el("div","block"); b4.appendChild(el("h4", null, "Что сделать на этой неделе"));
    var ol = el("ol","steps"), items = [];
    if(a.account === "personal" || a.account === "both") items.push("Открыть бизнес-счёт и перевести приём денег от клиентов на него.");
    if(a.kkm === "unsure") items.push("Посмотреть свой чек: есть ли на нём регистрационный номер ККМ, фискальный признак и QR-код.");
    if(a.kkm === "no") items.push("Поставить фискальную кассу и зарегистрировать её в налоговой.");
    if(a.ecp !== "me") items.push("Выяснить, где ваша ЭЦП, и перевести бухгалтера на доступ по ИНН.");
    if(a.mode === "unknown") items.push("Посмотреть свой режим в регистрационной карте — без этого всё считается наугад.");
    if(a.tech === "yes") items.push("Внести остатки техники в систему прослеживаемости.");
    if(a.form === "ip") items.push("Проверить, оплачен ли ваш страховой полис за себя.");
    items.push("Сверить формы № 24 и № 25 в Кабинете налогоплательщика.");
    items.slice(0,5).forEach(function(t){ ol.appendChild(el("li", null, t)); });
    b4.appendChild(ol); inner.appendChild(b4);

    var b5 = el("div","block");
    var fp = el("p","fineprint");
    fp.textContent = "Предварительная оценка по вашим ответам, а не налоговая консультация. Основание — Налоговый кодекс КР от 18.01.2022 № 3 в редакции от 06.08.2026" + (r.ref ? " (" + r.ref + ")" : "") + " и официальные сообщения ГНС за сентябрь–октябрь 2026. Названия банковских приложений приведены только как примеры.";
    b5.appendChild(fp); inner.appendChild(b5);

    d.appendChild(inner);
    out.appendChild(d);

    var rs = el("div","restart");
    rs.appendChild(sticker("cat_happy"));
    var again = el("button","btn ghost","Пройти заново");
    again.addEventListener("click", function(){
      answers = {}; step = 0; out.hidden = true; out.textContent = "";
      $("intro").hidden = false; window.scrollTo({top:0,behavior:"smooth"});
    });
    rs.appendChild(again); out.appendChild(rs);

    /* человек дошёл до результата — складываем его картину в таблицу.
       В Telegram это не уходит: там только те, кто нажал кнопку. */
    logAnswers(r, f, al, "прошёл");

    window.scrollTo({top:0,behavior:"smooth"});
  }
})();
</script>

</body></html>
